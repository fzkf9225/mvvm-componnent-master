plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.google.hilt.android)
    alias(libs.plugins.ksp)
}

android {
    namespace = 'io.coderf.arklab.media'
    compileSdk = libs.versions.compileSdkVersion.get().toInteger()
    defaultConfig {
        minSdk = libs.versions.minSdkVersion.get().toInteger()
        targetSdk = libs.versions.targetSdkVersion.get().toInteger()

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled = true
        // 放入 defaultConfig，确保 debug/release AAR 均携带 consumer 规则
        consumerProguardFiles('consumer-rules.pro')
        ndk {
            // armeabi-v7a：较旧 32 位；arm64-v8a：主流 64 位；x86/x86_64：模拟器
            abiFilters = ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']
        }
    }

    buildTypes {
        release {
            resValue("string", "app_config_file", "prod.properties" )
            buildConfigField("boolean", "LOG_DEBUG", "false")// 不显示log
            minifyEnabled = false// 混淆
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
        }
        debug {
            resValue("string", "app_config_file", "dev.properties")
            buildConfigField("boolean", "LOG_DEBUG", "true")// 显示log
            minifyEnabled = false// 混淆
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
        }
    }
    compileOptions {
        encoding = "UTF-8"
        targetCompatibility = JavaVersion.VERSION_17
        sourceCompatibility = JavaVersion.VERSION_17
    }
    lint {
        baseline = file("lint-baseline.xml")
    }
    ksp {
        arg("room.schemaLocation", "$projectDir/schemas")
    }
    kotlin {
        jvmToolchain(17)  // 这是 kotlin DSL 的写法
    }
    java {
        toolchain {
            languageVersion.set(JavaLanguageVersion.of(17))
        }
    }
    buildFeatures {
        //noinspection DataBindingWithoutKapt
        dataBinding = true
        buildConfig = true
    }
    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation libs.androidx.core.ktx
    implementation platform(libs.kotlin.bom)
    implementation libs.androidx.appcompat
    implementation libs.activity
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.common.java8
    implementation libs.org.aspectj.aspectjrt
    implementation libs.googlecode.isoparser
    implementation libs.com.squareup.picasso.picasso
    implementation libs.constraintlayout

    implementation libs.google.hilt.android
    annotationProcessor libs.google.hilt.android.compiler
    ksp libs.google.hilt.android.compiler

    implementation libs.androidx.exifinterface
    implementation libs.logger
}


// Publish: ./gradlew :commonmedia:publish (env: ALIYUN_USER_NAME / ALIYUN_PASSWORD)
apply plugin: 'maven-publish'

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'io.coderf.arklab.media'
                artifactId = 'media'
                version = '3.3.1'
            }
        }
        repositories {
            maven {
                url = 'https://packages.aliyun.com/maven/repository/2405978-release-ObRSGq/'
                credentials {
                    username = System.getenv('ALIYUN_USER_NAME')
                    password = System.getenv('ALIYUN_PASSWORD')
                }
            }
            maven {
                url = 'https://packages.aliyun.com/maven/repository/2405978-snapshot-rT6GM2/'
                credentials {
                    username = System.getenv('ALIYUN_USER_NAME')
                    password = System.getenv('ALIYUN_PASSWORD')
                }
            }
        }
    }
}