plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.ksp)
    alias(libs.plugins.google.hilt.android)
    alias(libs.plugins.navigation.safeargs)
}
android {
    namespace = 'io.coderf.arklab.demo'
    compileSdk = libs.versions.compileSdkVersion.get().toInteger()
    defaultConfig {
        applicationId  = "io.coderf.arklab.demo"
        minSdk = libs.versions.minSdkVersion.get().toInteger()
        targetSdk = libs.versions.targetSdkVersion.get().toInteger()
        versionCode =  1
        versionName = "1.0"
        testInstrumentationRunner =  "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled = true
        // 仅保留 arm64：真实设备主流 ABI；x86_64 的 ijk so 未完整 16KB 对齐，
        // 打进包会导致 Play / Studio 16KB 检查失败。模拟器请使用 arm64 系统镜像。
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters = ['arm64-v8a']
        }
    }

    buildTypes {
        release {
            resValue("string", "app_config_file", "prod.properties")  // 加上括号
            buildConfigField("boolean", "LOG_DEBUG", "false")  // 加上括号
            minifyEnabled = true
            zipAlignEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')  // 加上括号
        }
        debug {
            resValue("string", "app_config_file", "dev.properties")  // 加上括号
            buildConfigField("boolean", "LOG_DEBUG", "true")  // 加上括号
            minifyEnabled = false
            zipAlignEnabled = false
            shrinkResources = false
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')  // 加上括号
        }
    }
    compileOptions {
        encoding = "UTF-8"
        targetCompatibility = JavaVersion.VERSION_17
        sourceCompatibility = JavaVersion.VERSION_17
    }
    kotlin {
        jvmToolchain(17)  // 这是 kotlin DSL 的写法
    }
    java {
        toolchain {
            languageVersion.set(JavaLanguageVersion.of(17))
        }
    }
    ksp {
        arg("room.schemaLocation", "$projectDir/schemas")
    }
    buildFeatures {
        //noinspection DataBindingWithoutKapt
        dataBinding = true
        buildConfig = true
    }

    // Android 15+ 16KB page size 适配：
    // useLegacyPackaging = false 时，.so 以未压缩形式打入 APK/AAB，
    // 系统可按 16KB 页对齐直接 mmap，满足 Google 16KB 页要求。
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

