## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
#Thu Sep 26 10:57:13 CST 2024
kotlin.code.style=official
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.disableResourceValidation=true
android.enableJetifier=false
android.injected.testOnly=false
android.useAndroidX=true
org.gradle.configureondemand=true
org.gradle.daemon=true
org.gradle.parallel=true
userComponentIsApplication=false
org.jetbrains.kotlin.jvm.target=17
org.gradle.warning.mode=all
# DataBinding：由各 module 的 android.buildFeatures.dataBinding 显式开启
#（勿使用无效 key android.buildfeatures.databbinding）
#ksp.useKSP1=true
#ksp.useKSP2=true
# 核心内存配置：Gradle 构建 JVM
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# 限制 Kotlin daemon 内存，避免它额外吃掉大量内存
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true