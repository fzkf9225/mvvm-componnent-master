/**
 * common �?兼容聚合层（facade�?
 *
 * 业务侧继续：
 *   implementation project(':common')
 */
plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace = 'io.coderf.arklab.common.facade'
    compileSdk = libs.versions.compileSdkVersion.get().toInteger()
    defaultConfig {
        minSdk = libs.versions.minSdkVersion.get().toInteger()
        targetSdk = libs.versions.targetSdkVersion.get().toInteger()
        consumerProguardFiles('consumer-rules.pro')
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
        }
        debug { minifyEnabled = false }
    }
    compileOptions {
        encoding = "UTF-8"
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlin { jvmToolchain(17) }
    java { toolchain { languageVersion.set(JavaLanguageVersion.of(17)) } }
    buildFeatures { buildConfig = true }
    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {
    api project(':core-network')
    api project(':core-db')
    api project(':core-ui')
    // core-base / core-utils �?core-network、core-ui 传�?

    implementation platform(libs.kotlin.bom)
    implementation libs.androidx.core.ktx
    testImplementation libs.junit
}

// Publish: ./gradlew :common:publish (env: ALIYUN_USER_NAME / ALIYUN_PASSWORD)
apply plugin: 'maven-publish'

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'io.coderf.arklab.common'
                artifactId = 'common'
                version = '4.5.1'
            }
        }
        repositories {
            maven {
                url = 'https://packages.aliyun.com/maven/repository/2405978-release-ObRSGq/'
                credentials {
                    username = System.getenv('ALIYUN_USER_NAME')
                    password = System.getenv('ALIYUN_PASSWORD')
                }
            }
            maven {
                url = 'https://packages.aliyun.com/maven/repository/2405978-snapshot-rT6GM2/'
                credentials {
                    username = System.getenv('ALIYUN_USER_NAME')
                    password = System.getenv('ALIYUN_PASSWORD')
                }
            }
        }
    }
}